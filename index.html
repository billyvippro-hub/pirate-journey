<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Blox Fruits Web - Advanced R15 Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
        #canvas { display: block; margin: 0 auto; background: #3b7a57; border: 4px solid #222; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; width: 260px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .bar-bg { width: 100%; background: #444; height: 12px; border-radius: 6px; margin: 4px 0 10px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.1s; }
        #hpBar { background: #e74c3c; width: 100%; }
        #energyBar { background: #f39c12; width: 100%; }
        #expBar { background: #2ecc71; width: 0%; }
        .controls { font-size: 12px; color: #aaa; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ui">
        <div>⚔️ <b>Level:</b> <span id="lvl">1</span> | 💰 <b>Beli:</b> <span id="beli">0</span></div>
        
        <div style="margin-top: 8px; font-size: 12px;">MÁU (HP)</div>
        <div class="bar-bg"><div id="hpBar" class="bar-fill"></div></div>

        <div style="font-size: 12px;">NĂNG LƯỢNG (ENERGY)</div>
        <div class="bar-bg"><div id="energyBar" class="bar-fill"></div></div>

        <div style="font-size: 12px;">KINH NGHIỆM (EXP)</div>
        <div class="bar-bg"><div id="expBar" class="bar-fill"></div></div>

        <div>🍇 <b>Trái Ác Quỷ:</b> <span id="fruit">Buddha</span></div>
        <div class="controls">
            🎮 <b>Di chuyển:</b> WASD<br>
            👊 <b>Đánh thường M1:</b> Click Chuột Trái<br>
            💥 <b>Chiêu [Z] Phật Tổ:</b> Phím Z (Tốn 30 Energy)
        </div>
    </div>

    <canvas id="canvas" width="900" height="650"></canvas>

    <script>
        const RENDER_URL = "https://blox-fruits-backend.onrender.com"; // 👈 Sửa link Render tại đây!
        const USER_ID = "player123";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // --- NHÂN VẬT CHÍNH R15 ---
        const player = {
            x: 200, y: 300, speed: 4, sizeScale: 1,
            hp: 100, maxHp: 100, energy: 100, maxEnergy: 100,
            level: 1, exp: 0, maxExp: 100, beli: 0,
            isAttacking: false, isBuddha: false, attackTimer: 0,
            shockwave: null
        };

        // --- BOSS GORILLA KING ---
        const boss = {
            x: 650, y: 300, hp: 300, maxHp: 300, size: 60,
            speed: 1.5, alive: true, attackCooldown: 0
        };

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'z') useSkillZ();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !player.isAttacking) performM1();
        });

        // 1. ĐẤM THƯỜNG M1
        function performM1() {
            player.isAttacking = true;
            player.attackTimer = 8;
            
            // Xử lý gây sát thương cho Boss
            const reach = 50 * player.sizeScale;
            const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
            if (boss.alive && dist < reach + boss.size) {
                const dmg = 25 * player.sizeScale;
                boss.hp -= dmg;
                console.log(`💥 Đấm M1 trúng Boss! Mất ${dmg} HP!`);
                if (boss.hp <= 0) killBoss();
            }
        }

        // 2. SKILL Z TRÁI PHẬT TỔ (BUDDHA)
        function useSkillZ() {
            if (player.energy < 30) return;
            player.energy -= 30;

            // Kích hoạt hóa vàng & Phóng Sóng Âm (Shockwave)
            player.isBuddha = true;
            player.sizeScale = 1.8; // Biến to gấp đôi
            player.shockwave = { x: player.x, y: player.y, radius: 20, maxRadius: 120 };

            // Gây sát thương diện rộng (AoE)
            const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
            if (boss.alive && dist < 150) {
                boss.hp -= 80;
                if (boss.hp <= 0) killBoss();
            }
        }

        // 3. TIÊU DIỆT BOSS & THƯỞNG
        function killBoss() {
            boss.alive = false;
            player.exp += 60;
            player.beli += 5000;
            
            if (player.exp >= player.maxExp) {
                player.level++;
                player.exp -= player.maxExp;
                player.maxExp = Math.floor(player.maxExp * 1.5);
                player.maxHp += 20; player.hp = player.maxHp;
            }

            updateUI();
            saveDataToRender();

            // Hồi sinh Boss sau 4 giây
            setTimeout(() => {
                boss.hp = boss.maxHp;
                boss.x = 650; boss.y = 300;
                boss.alive = true;
            }, 4000);
        }

        // 4. LƯU TIẾN TRÌNH LÊN RENDER
        async function saveDataToRender() {
            try {
                await fetch(`${RENDER_URL}/api/player/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: USER_ID, level: player.level,
                        exp: player.exp, beli: player.beli
                    })
                });
            } catch (e) { console.warn("Lỗi Save!"); }
        }

        // 5. CẬP NHẬT GIAO DIỆN UI
        function updateUI() {
            document.getElementById('lvl').innerText = player.level;
            document.getElementById('beli').innerText = player.beli;
            document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('energyBar').style.width = (player.energy / player.maxEnergy * 100) + '%';
            document.getElementById('expBar').style.width = (player.exp / player.maxExp * 100) + '%';
        }

        // --- VÒNG LẶP CHÍNH (GAME LOOP) ---
        function loop() {
            // -- Di chuyển Player --
            if (keys['w']) player.y -= player.speed;
            if (keys['s']) player.y += player.speed;
            if (keys['a']) player.x -= player.speed;
            if (keys['d']) player.x += player.speed;

            // Hồi Năng lượng tự động
            if (player.energy < player.maxEnergy) player.energy += 0.1;

            // -- AI Boss Rượt Đấm --
            if (boss.alive) {
                const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
                
                if (dist > 40) {
                    boss.x += Math.cos(angle) * boss.speed;
                    boss.y += Math.sin(angle) * boss.speed;
                } else {
                    // Boss đấm Player
                    boss.attackCooldown++;
                    if (boss.attackCooldown > 40) {
                        player.hp = Math.max(0, player.hp - 10);
                        boss.attackCooldown = 0;
                        updateUI();
                    }
                }
            }

            // -- VẼ ĐỒ HỌA --
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ Sóng Âm Trái Buddha
            if (player.shockwave) {
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(player.shockwave.x, player.shockwave.y, player.shockwave.radius, 0, Math.PI * 2);
                ctx.stroke();
                player.shockwave.radius += 8;
                if (player.shockwave.radius > player.shockwave.maxRadius) player.shockwave = null;
            }

            // Vẽ Player R15 (Tùy biến vàng kim nếu đang bật Buddha)
            const s = player.sizeScale;
            ctx.fillStyle = player.isBuddha ? '#f1c40f' : '#0066cc'; // Thân
            ctx.fillRect(player.x - 15 * s, player.y - 15 * s, 30 * s, 30 * s);
            ctx.fillStyle = '#ffcc99'; // Đầu
            ctx.fillRect(player.x - 10 * s, player.y - 35 * s, 20 * s, 20 * s);

            // Hiệu ứng M1
            if (player.isAttacking) {
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.arc(player.x + 30 * s, player.y, 15 * s, 0, Math.PI * 2);
                ctx.fill();
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            // Vẽ Boss Gorilla King & Thanh Máu Boss
            if (boss.alive) {
                ctx.fillStyle = '#4a235a';
                ctx.fillRect(boss.x - boss.size/2, boss.y - boss.size/2, boss.size, boss.size);
                
                // Máu Boss
                ctx.fillStyle = '#222';
                ctx.fillRect(boss.x - 40, boss.y - 45, 80, 8);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(boss.x - 40, boss.y - 45, (boss.hp / boss.maxHp) * 80, 8);
            }

            updateUI();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
